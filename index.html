    const Icon = ({ name, size = 20, className = "" }) => {
      const iconRef = useRef(null);
      useEffect(() => {
        if (window.lucide && iconRef.current) {
          window.lucide.createIcons({
            root: iconRef.current,
            nameAttr: 'data-lucide',
            attrs: {
              width: size,
              height: size,
              class: className
            }
          });
        }
      }, [name, size, className]);

      return (
        <span ref={iconRef} className="inline-flex items-center justify-center">
          <i data-lucide={name}></i>
        </span>
      );
    };

    // Animated Counter Hook
    const AnimatedStat = ({ value, suffix, label, sublabel, showSampleBadge }) => {
      const [count, setCount] = useState(0);
      const ref = useRef(null);

      useEffect(() => {
        let observer = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting) {
              let start = 0;
              const end = parseInt(value, 10);
              const duration = 1600;
              const stepTime = Math.max(Math.floor(duration / end), 20);
              const timer = setInterval(() => {
                start += Math.ceil(end / 40);
                if (start >= end) {
                  setCount(end);
                  clearInterval(timer);
                } else {
                  setCount(start);
                }
              }, stepTime);
              observer.disconnect();
            }
          },
          { threshold: 0.3 }
        );
        if (ref.current) observer.observe(ref.current);
        return () => observer.disconnect();
      }, [value]);

      return (
        <div ref={ref} className="relative p-6 md:p-8 border-b md:border-b-0 md:border-r border-ivory-stone last:border-r-0">
          {showSampleBadge && (
            <span className="inline-block mb-2 text-[10px] uppercase tracking-widest px-2 py-0.5 bg-sage/20 text-navy font-semibold rounded">
              Editable Metric
            </span>
          )}
          <div className="font-serif text-4xl md:text-5xl lg:text-6xl font-medium text-navy tracking-tight mb-2">
            {count}{suffix}
          </div>
          <div className="text-sm font-semibold text-navy uppercase tracking-wider mb-1">{label}</div>
          <p className="text-xs text-navy/65 leading-relaxed">{sublabel}</p>
        </div>
      );

                          <div className="text-xs font-semibold uppercase tracking-wider text-navy">
                            Included Clinical Components:
                          </div>
                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                            {service.benefits.map((b, i) => (
                              <div key={i} className="flex items-start gap-2 text-xs text-navy/80">
                                <Icon name="check-circle-2" size={15} className="text-sage-dark shrink-0 mt-0.5" />
                                <span>{b}</span>
                              </div>
                            ))}
                          </div>
                        </div>

                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pt-2">
                          <p className="text-xs text-navy/60 italic">
                            Preparation: {service.preparation}
                          </p>
                          <button
                            onClick={() => navigateTo("appointment", service.title)}
                            className="bg-navy text-ivory px-7 py-3.5 rounded-full text-xs uppercase tracking-widest font-semibold hover:bg-navy-light transition-colors shrink-0 self-start"
                          >
                            Book This Service
                          </button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* =========================================================
                4. APPOINTMENT PAGE
               ========================================================= */}
            {activePage === "appointment" && (
              <div className="animate-fade-up py-14 sm:py-20 px-4 sm:px-8 max-w-6xl mx-auto">
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-12">
                  
                  {/* Left Info Column */}
                  <div className="lg:col-span-5 space-y-6">
                    <span className="text-xs uppercase tracking-[0.2em] text-sage-dark font-semibold">
                      Private Scheduling Desk
                    </span>
                    <h1 className="font-serif text-4xl sm:text-5xl text-navy leading-tight">
                      Request a Personal Consultation.
                    </h1>
                    <p className="text-sm sm:text-base text-navy/75 leading-relaxed">
                      Select your preferred medical specialty, date, and time window. To ensure complete privacy and adequate preparation for your visit, all online submissions are reviewed by our medical liaison team.
                    </p>

                    <div className="p-6 rounded-3xl bg-sage/20 border border-sage/40 space-y-2">
                      <div className="flex items-center gap-2 text-xs font-semibold uppercase tracking-wider text-navy">
                        <Icon name="info" size={16} />
                        <span>Important Scheduling Notice</span>
                      </div>
                      <p className="text-xs text-navy/80 leading-relaxed">
                        Online submissions are <strong>appointment requests</strong> until formally confirmed by the clinic via telephone or encrypted email within 4 business hours.
                      </p>
                    </div>

                    <div className="p-6 rounded-3xl bg-ivory-warm border border-ivory-stone space-y-4">
                      <h3 className="font-serif text-2xl text-navy">Need Immediate Assistance?</h3>
                      <p className="text-xs text-navy/70 leading-relaxed">
                        For same-day acute appointments or international travel coordination, please call our reception directly.
                      </p>
                      <div className="text-sm font-semibold text-navy">+41 44 500 29 10</div>
                      <div className="text-xs text-navy/60">concierge@aureliaclinic.ch</div>
                    </div>
                  </div>

                  {/* Right Interactive Form Column */}
                  <div className="lg:col-span-7">
                    {bookingSubmitted ? (
                      <div className="bg-ivory-warm border border-ivory-stone rounded-[2.5rem] p-8 sm:p-12 space-y-6 animate-fade-up">
                        <div className="w-14 h-14 rounded-full bg-sage/30 text-navy flex items-center justify-center">
                          <Icon name="check" size={28} />
                        </div>
                        <span className="text-xs uppercase tracking-widest text-sage-dark font-semibold block">
                          Request Logged · Ref #{bookingReference}
                        </span>
                        <h2 className="font-serif text-3xl sm:text-4xl text-navy">
                          Thank You, {formData.fullName}.
                        </h2>
                        <p className="text-sm text-navy/75 leading-relaxed">
                          We have received your consultation request for <strong>{formData.service}</strong> on <strong>{formData.date}</strong> ({formData.timeSlot}). Please note that this time slot is held provisionally until our patient liaison team contacts you at <strong>{formData.phone}</strong> or <strong>{formData.email}</strong> to finalize your confirmation.
                        </p>
                        <div className="pt-4">
                          <button
                            onClick={() => setBookingSubmitted(false)}
                            className="bg-navy text-ivory px-7 py-3 rounded-full text-xs uppercase tracking-widest font-semibold"
                          >
                            Modify or Submit Another Request
                          </button>
                        </div>
                      </div>
                    ) : (
                      <form
                        onSubmit={handleBookingSubmit}
                        className="bg-ivory-warm border border-ivory-stone rounded-[2.5rem] p-8 sm:p-12 space-y-6 shadow-sm"
                      >
                        {formError && (
                          <div className="p-4 rounded-2xl bg-red-900/10 border border-red-800/30 text-xs text-red-900 font-medium">
                            {formError}
                          </div>
                        )}

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                          <div>
                            <label className="block text-xs font-semibold uppercase tracking-wider text-navy mb-2">
                              Patient Full Name *
                            </label>
                            <input
                              type="text"
                              required
                              placeholder="e.g., Clara von Meyenburg"
                              value={formData.fullName}
                              onChange={(e) => setFormData({ ...formData, fullName: e.target.value })}
                              className="w-full px-4 py-3.5 rounded-xl bg-ivory border border-ivory-stone text-sm focus:outline-none focus:border-navy"
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-semibold uppercase tracking-wider text-navy mb-2">
                              Email Address *
                            </label>
                            <input
                              type="email"
                              required
                              placeholder="name@domain.ch"
                              value={formData.email}
                              onChange={(e) => setFormData({ ...formData, email: e.target.value })}
                              className="w-full px-4 py-3.5 rounded-xl bg-ivory border border-ivory-stone text-sm focus:outline-none focus:border-navy"
                            />
                          </div>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                          <div>
                            <label className="block text-xs font-semibold uppercase tracking-wider text-navy mb-2">
                              Telephone Number *
                            </label>
                            <input
                              type="tel"
                              required
                              placeholder="+41 79 000 00 00"
                              value={formData.phone}
                              onChange={(e) => setFormData({ ...formData, phone: e.target.value })}
                              className="w-full px-4 py-3.5 rounded-xl bg-ivory border border-ivory-stone text-sm focus:outline-none focus:border-navy"
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-semibold uppercase tracking-wider text-navy mb-2">
                              Select Medical Service *
                            </label>
                            <select
                              value={formData.service}
                              onChange={(e) => setFormData({ ...formData, service: e.target.value })}
                              className="w-full px-4 py-3.5 rounded-xl bg-ivory border border-ivory-stone text-sm focus:outline-none focus:border-navy"
                            >
                              {SERVICES.map((s) => (
                                <option key={s.id} value={s.title}>
                                  {s.title}
                                </option>
                              ))}
                            </select>
                          </div>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                          <div>
                            <label className="block text-xs font-semibold uppercase tracking-wider text-navy mb-2">
                              Preferred Date *
                            </label>
                            <input
                              type="date"
                              required
                              value={formData.date}
                              onChange={(e) => setFormData({ ...formData, date: e.target.value })}
                              className="w-full px-4 py-3.5 rounded-xl bg-ivory border border-ivory-stone text-sm focus:outline-none focus:border-navy"
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-semibold uppercase tracking-wider text-navy mb-2">
                              Preferred Time Window
                            </label>
                            <select
                              value={formData.timeSlot}
                              onChange={(e) => setFormData({ ...formData, timeSlot: e.target.value })}
                              className="w-full px-4 py-3.5 rounded-xl bg-ivory border border-ivory-stone text-sm focus:outline-none focus:border-navy"
                            >
                              <option>08:30 AM (Morning Fasted Slot)</option>
                              <option>09:30 AM</option>
                              <option>11:00 AM</option>
                              <option>02:00 PM</option>
                              <option>04:00 PM</option>
                            </select>
                          </div>
                        </div>

                        <div>
                          <label className="block text-xs font-semibold uppercase tracking-wider text-navy mb-2">
                            Additional Notes or Clinical Questions (Optional)
                          </label>
                          <textarea
                            rows="3"
                            placeholder="Share any specific health goals, language preferences, or scheduling notes..."
                            value={formData.notes}
                            onChange={(e) => setFormData({ ...formData, notes: e.target.value })}
                            className="w-full px-4 py-3.5 rounded-xl bg-ivory border border-ivory-stone text-sm focus:outline-none focus:border-navy"
                          ></textarea>
                        </div>

                        <button
                          type="submit"
                          className="w-full bg-navy text-ivory py-4 rounded-full text-xs uppercase tracking-widest font-semibold hover:bg-navy-light transition-all shadow-md"
                        >
                          Submit Appointment Request
                        </button>

                        <p className="text-[11px] text-center text-navy/60">
                          By submitting this form, you acknowledge that this request is subject to clinic confirmation. For medical emergencies, dial 144 (Switzerland) or 112 immediately.
                        </p>
                      </form>
                    )}
                  </div>

                </div>
              </div>
            )}

            {/* =========================================================
                5. CONTACT PAGE
               ========================================================= */}
            {activePage === "contact" && (
              <div className="animate-fade-up py-14 sm:py-20 px-4 sm:px-8 max-w-7xl mx-auto space-y-16">
                
                {/* Emergency Disclaimer Banner */}
                <div className="bg-navy text-ivory px-6 py-4 rounded-2xl flex flex-wrap items-center justify-between gap-4">
                  <div className="flex items-center gap-3 text-xs sm:text-sm">
                    <Icon name="alert-circle" size={18} className="text-sage shrink-0" />
                    <span>
                      <strong>Medical Emergency Disclaimer:</strong> Aurelia Clinic is an appointment-only outpatient practice and does not operate a 24/7 emergency trauma room.
                    </span>
                  </div>
                  <span className="text-xs font-semibold bg-white/10 px-3 py-1 rounded-full">
                    Emergency Services: Dial 144 or 112
                  </span>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-12">
                  {/* Left Column: Address, Hours, Direct Contact */}
                  <div className="lg:col-span-5 space-y-8">
                    <div>
                      <span className="text-xs uppercase tracking-[0.2em] text-sage-dark font-semibold">
                        Zürich City Center
                      </span>
                      <h1 className="font-serif text-4xl sm:text-5xl text-navy mt-1">
                        Location & Patient Liaison
                      </h1>
                    </div>

                    <div className="space-y-6 bg-ivory-warm p-8 rounded-3xl border border-ivory-stone">
                      <div>
                        <div className="text-xs font-semibold uppercase tracking-wider text-navy/60">Clinic Address (Editable)</div>
                        <div className="font-serif text-2xl text-navy mt-1">Bahnhofstrasse 42, 3rd Floor</div>
                        <div className="text-sm text-navy/75">8001 Zürich, Switzerland</div>
                        <p className="text-xs text-navy/60 mt-1">
                          Private elevator access directly from the courtyard entrance. Valet parking available upon prior request.
                        </p>
                      </div>

                      <div className="border-t border-ivory-stone pt-4">
                        <div className="text-xs font-semibold uppercase tracking-wider text-navy/60">Direct Telephone & Email</div>
                        <div className="text-base font-semibold text-navy mt-1">+41 44 500 29 10</div>
                        <div className="text-sm text-navy/75">concierge@aureliaclinic.ch</div>
                      </div>

                      <div className="border-t border-ivory-stone pt-4">
                        <div className="text-xs font-semibold uppercase tracking-wider text-navy/60 mb-2">Clinic Opening Hours</div>
                        <div className="space-y-1.5 text-xs text-navy/80">
                          <div className="flex justify-between">
                            <span>Monday – Thursday</span>
                            <span className="font-semibold">08:00 – 18:30</span>
                          </div>
                          <div className="flex justify-between">
                            <span>Friday</span>
                            <span className="font-semibold">08:00 – 17:00</span>
                          </div>
                          <div className="flex justify-between">
                            <span>Saturday</span>
                            <span className="font-semibold">By Private Arrangement</span>
                          </div>
                          <div className="flex justify-between text-navy/50">
                            <span>Sunday & Public Holidays</span>
                            <span>Closed</span>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* Right Column: Interactive Map Placeholder & Contact Form */}
                  <div className="lg:col-span-7 space-y-8">
                    {/* Styled Architectural Map Placeholder */}
                    <div className="relative rounded-3xl overflow-hidden border border-ivory-stone bg-navy h-64 flex items-center justify-center">
                      <img
                        src="https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?auto=format&fit=crop&w=1200&q=80"
                        alt="Zürich City Center Map View"
                        className="w-full h-full object-cover opacity-35"
                      />
                      <div className="absolute inset-0 bg-gradient-to-t from-navy via-navy/50 to-transparent"></div>
                      <div className="relative z-10 text-center p-6 space-y-3">
                        <div className="w-10 h-10 rounded-full bg-sage text-navy mx-auto flex items-center justify-center shadow-lg">
                          <Icon name="map-pin" size={20} />
                        </div>
                        <div className="font-serif text-2xl text-ivory">Aurelia Clinic · Bahnhofstrasse 42</div>
                        <p className="text-xs text-ivory/75 max-w-md mx-auto">
                          2 minutes on foot from Paradeplatz · 6 minutes from Zürich Hauptbahnhof (Google Maps Embed Placeholder)
                        </p>
                      </div>
                    </div>

                    {/* General Inquiry Form */}
                    <div className="bg-ivory-warm p-8 rounded-3xl border border-ivory-stone">
                      <h2 className="font-serif text-3xl text-navy mb-2">Send a General Inquiry</h2>
                      <p className="text-xs text-navy/70 mb-6">
                        For press, corporate executive health partnerships, or general non-urgent questions.
                      </p>

                      {contactSent ? (
                        <div className="p-6 rounded-2xl bg-sage/25 text-navy text-sm font-medium">
                          ✓ Thank you. Your message has been delivered to our patient liaison desk.
                        </div>
                      ) : (
                        <form
                          onSubmit={(e) => {
                            e.preventDefault();
                            setContactSent(true);
                          }}
                          className="space-y-4"
                        >
                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <input
                              type="text"
                              required
                              placeholder="Your Full Name"
                              className="w-full px-4 py-3 rounded-xl bg-ivory border border-ivory-stone text-sm"
                            />
                            <input
                              type="email"
                              required
                              placeholder="Your Email Address"
                              className="w-full px-4 py-3 rounded-xl bg-ivory border border-ivory-stone text-sm"
                            />
                          </div>
                          <textarea
                            rows="3"
                            required
                            placeholder="How may our liaison team assist you?"
                            className="w-full px-4 py-3 rounded-xl bg-ivory border border-ivory-stone text-sm"
                          ></textarea>
                          <button
                            type="submit"
                            className="bg-navy text-ivory px-7 py-3.5 rounded-full text-xs uppercase tracking-widest font-semibold hover:bg-navy-light transition-colors"
                          >
                            Send Message
                          </button>
                        </form>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* PROFESSIONAL FOOTER */}
          <footer className="bg-navy-dark text-ivory border-t border-white/10 pt-16 pb-12 px-4 sm:px-8 mt-auto">
            <div className="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-10 pb-12 border-b border-white/10">
              <div className="lg:col-span-2 space-y-4">
                <div className="flex items-center gap-3">
                  <div className="w-9 h-9 rounded-full bg-sage text-navy flex items-center justify-center font-serif text-lg font-bold">
                    A
                  </div>
                  <span className="font-serif text-2xl tracking-tight">AURELIA CLINIC ZÜRICH</span>
                </div>
                <p className="text-xs text-ivory/65 max-w-sm leading-relaxed">
                  Private Swiss practice for internal medicine, preventive cardiology, executive health diagnostics, and longevity care. Designed for calm, clinical excellence.
                </p>
                <div className="text-xs text-sage">
                  Bahnhofstrasse 42 · 8001 Zürich · +41 44 500 29 10
                </div>
              </div>

              <div className="space-y-2.5 text-xs">
                <div className="uppercase tracking-widest text-ivory/50 font-semibold mb-3">Navigation</div>
                {[
                  { id: "home", label: "Home Overview" },
                  { id: "about", label: "The Physician & Clinic" },
                  { id: "services", label: "Medical Specialties" },
                  { id: "appointment", label: "Book an Appointment" },
                  { id: "contact", label: "Location & Contact" }
                ].map((link) => (
                  <button
                    key={link.id}
                    onClick={() => navigateTo(link.id)}
                    className="block text-ivory/75 hover:text-sage transition-colors"
                  >
                    {link.label}
                  </button>
                ))}
              </div>

              <div className="space-y-2.5 text-xs">
                <div className="uppercase tracking-widest text-ivory/50 font-semibold mb-3">Specialties</div>
                {SERVICES.map((s) => (
                  <button
                    key={s.id}
                    onClick={() => navigateTo("services")}
                    className="block text-left text-ivory/75 hover:text-sage transition-colors"
                  >
                    {s.title}
                  </button>
                ))}
              </div>

              <div className="space-y-3 text-xs">
                <div className="uppercase tracking-widest text-ivory/50 font-semibold">Hours & Notices</div>
                <p className="text-ivory/70 leading-relaxed">
                  Mon – Fri: 08:00 – 18:30<br />
                  Sat: By Private Arrangement
                </p>
                <p className="text-[11px] text-ivory/50 leading-relaxed">
                  All doctor profiles, timelines, and clinical statistics on this template are clearly editable sample content for demonstration purposes.
                </p>
              </div>
            </div>

            <div className="max-w-7xl mx-auto pt-8 flex flex-col sm:flex-row items-center justify-between text-xs text-ivory/50 gap-4">
              <div>© {new Date().getFullYear()} Aurelia Clinic Zürich. All rights reserved.</div>
              <div className="flex space-x-6">
                <span>Swiss Medical Privacy Compliant</span>
                <span>Imprint & Legal Notice</span>
              </div>
            </div>
          </footer>

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
